---
name: lint-md
on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
    paths: ['**.md', .markdownlint.yaml, .github/workflows/lint-md.yml]
permissions:
  contents: read
jobs:
  markdownlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Markdown with markdownlint
        # yamllint disable-line rule:line-length
        uses: reviewdog/action-markdownlint@584c3e89347d0b16ede47c73ae199550a02b1b37  # v0.33.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: info
          fail_level: any
  rumdl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Set up reviewdog
        # yamllint disable-line rule:line-length
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f  # v1.5.0
      - name: Lint Markdown with rumdl
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          uvx rumdl check . --output-format json-lines > rumdl.jsonl || true
          jq -c '
            {
              source: {name: "rumdl"},
              severity: (.severity | ascii_upcase),
              message: .message,
              location: {
                path: .file,
                range: {start: {line: .line, column: .column}}
              },
              code: {value: .rule}
            }
          ' rumdl.jsonl \
            | reviewdog \
                -f=rdjsonl \
                -name=rumdl \
                -reporter=github-pr-review \
                -filter-mode=added \
                -fail-level=any
