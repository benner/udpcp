---
name: test
on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable
        with:
          components: llvm-tools-preview
      # yamllint disable-line rule:line-length
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      # yamllint disable-line rule:line-length
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519  # v2.90.5
        with:
          tool: cargo-llvm-cov
      - name: Run tests with coverage
        run: |
          mkdir -p pr
          cargo llvm-cov --json \
            | jq '.data[0].totals.lines.percent' > pr/percent.txt
          cat pr/percent.txt
      - name: Record PR number
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: echo "$PR_NUMBER" > pr/NR
      # yamllint disable-line rule:line-length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pr
          path: pr/
